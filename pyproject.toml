[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "deepnmr-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy", "pandas", "pyarrow", "scipy", "PyYAML", "rdkit"]
[tool.setuptools.packages.find]
where = ["src"]
