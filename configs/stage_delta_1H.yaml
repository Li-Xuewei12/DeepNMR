mode: full
nucleus: 1H
seed: 11
data:
  cache_dir: data/dft8k
  train_limit: 0
  validation_limit: 0
initialization:
  kind: topology
  checkpoint: weights/topology_initialization.pt
model:
  hidden_dim: 256
  topology_layers: 2
  spatial_layers: 4
  rbf_count: 128
  rbf_gamma: 10.0
  cutoff: 5.0
  dropout: 0.05
training:
  batch_size: 32
  num_workers: 4
  max_epochs: 500
  mixed_precision: true
  peak_lr: 0.0003
  minimum_lr: 1.0e-06
  warmup_ratio: 0.03
  weight_decay: 1.0e-05
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  gradient_clip: 1.0
  log_interval_steps: 50
  early_stopping_patience_epochs: 60
  early_stopping_min_delta: 0.0002
runtime:
  device: cuda:0
acceptance:
  invariance_tolerance: 0.0001
output_dir: runs/stage_delta_1H
